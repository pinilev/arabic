            { hebrew: "איך", arabic: "כיף", category: "מילות שאלה" },

        const searchInput = document.getElementById('search-input');

        const sectionFlashcards = document.getElementById('section-flashcards');
        const sectionQuiz = document.getElementById('section-quiz');
        const sectionList = document.getElementById('section-list');

        const modeFlashcardsBtn = document.getElementById('mode-flashcards');
        const modeQuizBtn = document.getElementById('mode-quiz');
        const modeListBtn = document.getElementById('mode-list');

        const cardContainer = document.getElementById('card-container');
        const card = document.getElementById('card');
        const cardHebrew = document.getElementById('card-hebrew');
        const cardArabic = document.getElementById('card-arabic');
        const cardCatFront = document.getElementById('card-cat-front');
        const cardCatBack = document.getElementById('card-cat-back');
        const cardCounter = document.getElementById('card-counter');
        const cardCategoryBadge = document.getElementById('card-category-badge');
        
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const randomBtn = document.getElementById('random-btn');

        const vocabTableBody = document.getElementById('vocab-table-body');

        const quizQuestion = document.getElementById('quiz-question');
        const quizOptions = document.getElementById('quiz-options');
        const quizFeedback = document.getElementById('quiz-feedback');
        const quizScoreEl = document.getElementById('quiz-score');
        const quizProgressEl = document.getElementById('quiz-progress');
        const quizNextBtn = document.getElementById('quiz-next-btn');

        // Populate Categories
        const categories = [...new Set(vocabulary.map(item => item.category))];
        categories.forEach(cat => {
            const opt = document.createElement('option');
            opt.value = cat;
            opt.textContent = cat;
            categorySelect.appendChild(opt);
        });

        // Filter Logic
        function applyFilters() {
            const cat = categorySelect.value;
            const search = searchInput.value.trim().toLowerCase();

            filteredVocab = vocabulary.filter(item => {
                const matchCat = (cat === 'all' || item.category === cat);
                const matchSearch = item.hebrew.toLowerCase().includes(search) || item.arabic.toLowerCase().includes(search);
                return matchCat && matchSearch;
            });

            currentIndex = 0;
            updateFlashcard();
            renderListTable();
        }

        categorySelect.addEventListener('change', applyFilters);
        searchInput.addEventListener('input', applyFilters);

        // Switch View Modes
        function setMode(mode) {
            sectionFlashcards.classList.add('hidden');
            sectionQuiz.classList.add('hidden');
            sectionList.classList.add('hidden');

            const inactiveStyle = "hover:bg-teal-700/60 text-white font-medium px-4 py-1.5 rounded-lg text-sm transition";
            const activeStyle = "bg-white text-teal-900 font-semibold px-4 py-1.5 rounded-lg text-sm transition shadow";

            modeFlashcardsBtn.className = inactiveStyle;
            modeQuizBtn.className = inactiveStyle;
            modeListBtn.className = inactiveStyle;

            if (mode === 'flashcards') {
                sectionFlashcards.classList.remove('hidden');
                modeFlashcardsBtn.className = activeStyle;
            } else if (mode === 'quiz') {
                sectionQuiz.classList.remove('hidden');
                modeQuizBtn.className = activeStyle;
                initQuiz();
            } else if (mode === 'list') {
                sectionList.classList.remove('hidden');
                modeListBtn.className = activeStyle;
                renderListTable();
            }
        }

        modeFlashcardsBtn.addEventListener('click', () => setMode('flashcards'));
        modeQuizBtn.addEventListener('click', () => setMode('quiz'));
        modeListBtn.addEventListener('click', () => setMode('list'));

        // Card Flip
        cardContainer.addEventListener('click', () => {
            card.classList.toggle('rotate-y-180');
        });

        function updateFlashcard() {
            card.classList.remove('rotate-y-180');
            
            if (filteredVocab.length === 0) {
                cardHebrew.textContent = "לא נמצאו מילים";
                cardArabic.textContent = "-";
                cardCatFront.textContent = "-";
                cardCatBack.textContent = "-";
                cardCounter.textContent = "0 / 0";
                cardCategoryBadge.textContent = categorySelect.value === 'all' ? 'הכל' : categorySelect.value;
                return;
            }

            const current = filteredVocab[currentIndex];
            cardHebrew.textContent = current.hebrew;
            cardArabic.textContent = current.arabic;
            cardCatFront.textContent = current.category;
            cardCatBack.textContent = current.category;
            cardCounter.textContent = `${currentIndex + 1} / ${filteredVocab.length}`;
            cardCategoryBadge.textContent = categorySelect.value === 'all' ? 'כל הנושאים' : categorySelect.value;
        }

        prevBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            if (!filteredVocab.length) return;
            currentIndex = (currentIndex - 1 + filteredVocab.length) % filteredVocab.length;
            updateFlashcard();
        });

        nextBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            if (!filteredVocab.length) return;
            currentIndex = (currentIndex + 1) % filteredVocab.length;
            updateFlashcard();
        });

        randomBtn.addEventListener('click', () => {
            if (!filteredVocab.length) return;
            currentIndex = Math.floor(Math.random() * filteredVocab.length);
            updateFlashcard();
        });

        // List View Render
        function renderListTable() {
            vocabTableBody.innerHTML = '';
            filteredVocab.forEach(item => {
                const tr = document.createElement('tr');
                tr.className = "hover:bg-slate-50 transition border-b border-slate-100";
                tr.innerHTML = `
                    <td class="p-3.5 font-medium text-slate-800">${item.hebrew}</td>
                    <td class="p-3.5 text-teal-700 font-bold">${item.arabic}</td>
                    <td class="p-3.5"><span class="text-xs bg-teal-50 text-teal-700 font-semibold px-2 py-0.5 rounded-md border border-teal-200/50">${item.category}</span></td>
                `;
                vocabTableBody.appendChild(tr);
            });
        }

        // Quiz Logic
        function initQuiz() {
            quizScore = 0;
            quizCurrentIndex = 0;
            quizScoreEl.textContent = `ניקוד: 0`;

            const pool = filteredVocab.length >= 4 ? filteredVocab : vocabulary;
            quizQuestions = [...pool].sort(() => 0.5 - Math.random()).slice(0, 10);
            
            renderQuizStep();
        }

        function renderQuizStep() {
            quizFeedback.textContent = '';
            quizNextBtn.classList.add('hidden');
            quizOptions.innerHTML = '';

            const q = quizQuestions[quizCurrentIndex];
            quizQuestion.textContent = q.hebrew;
            quizProgressEl.textContent = `שאלה ${quizCurrentIndex + 1} מתוך ${quizQuestions.length}`;

            // Mix distractors
            let options = [q.arabic];
            let distractors = vocabulary.filter(v => v.arabic !== q.arabic).sort(() => 0.5 - Math.random()).slice(0, 3);
            distractors.forEach(d => options.push(d.arabic));
            options.sort(() => 0.5 - Math.random());

            options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = "w-full text-right bg-slate-50 hover:bg-slate-100 border border-slate-200 p-3.5 rounded-xl text-base font-semibold text-slate-700 transition flex justify-between items-center active:scale-[0.99]";
                btn.innerHTML = `<span>${opt}</span><i class="far fa-circle text-slate-300"></i>`;
                btn.onclick = () => selectQuizAnswer(btn, opt, q.arabic);
                quizOptions.appendChild(btn);
            });
        }

        function selectQuizAnswer(btn, chosen, correct) {
            const allBtns = quizOptions.querySelectorAll('button');
            allBtns.forEach(b => b.disabled = true);

            if (chosen === correct) {
                btn.className = "w-full text-right bg-emerald-50 border-2 border-emerald-500 p-3.5 rounded-xl text-base font-bold text-emerald-800 flex justify-between items-center";
                btn.querySelector('i').className = "fas fa-check-circle text-emerald-600";
                quizFeedback.textContent = "כל הכבוד! תשובה נכונה ✨";
                quizFeedback.className = "text-center font-bold text-sm min-h-[24px] mb-4 text-emerald-600";
                quizScore += 10;
                quizScoreEl.textContent = `ניקוד: ${quizScore}`;
            } else {
                btn.className = "w-full text-right bg-rose-50 border-2 border-rose-500 p-3.5 rounded-xl text-base font-bold text-rose-800 flex justify-between items-center";
                btn.querySelector('i').className = "fas fa-times-circle text-rose-600";

                allBtns.forEach(b => {
                    if (b.textContent.trim() === correct) {
                        b.className = "w-full text-right bg-emerald-50 border-2 border-emerald-400 p-3.5 rounded-xl text-base font-bold text-emerald-700 flex justify-between items-center";
                    }
                });

                quizFeedback.textContent = `לא מדויק, התשובה הנכונה היא: ${correct}`;
                quizFeedback.className = "text-center font-bold text-sm min-h-[24px] mb-4 text-rose-600";
            }

            quizNextBtn.classList.remove('hidden');
        }

        quizNextBtn.addEventListener('click', () => {
            quizCurrentIndex++;
            if (quizCurrentIndex < quizQuestions.length) {
                renderQuizStep();
            } else {
                finishQuiz();
            }
        });

        function finishQuiz() {
            quizQuestion.textContent = "המבחן הושלם!";
            quizOptions.innerHTML = `
                <div class="text-center py-6">
                    <p class="text-sm text-slate-500 mb-1">הציון הסופי שלך:</p>
                    <p class="text-5xl font-extrabold text-teal-700 mb-3">${quizScore}</p>
                    <p class="text-xs text-slate-600">${quizScore >= 80 ? 'תוצאה מעולה! המשך כך!' : 'מומלץ לעבור שוב על הכרטיסיות ולתרגל.'}</p>
                </div>
            `;
            quizFeedback.textContent = '';
            quizNextBtn.classList.add('hidden');

            const restartBtn = document.createElement('button');
            restartBtn.className = "w-full bg-teal-700 hover:bg-teal-800 text-white font-bold py-3 rounded-2xl shadow transition text-sm";
            restartBtn.textContent = "התחל מבחן חדש";
            restartBtn.onclick = initQuiz;
            quizOptions.appendChild(restartBtn);
        }

        // Keyboard navigation
        document.addEventListener('keydown', (e) => {
            if (!sectionFlashcards.classList.contains('hidden')) {
                if (e.key === 'ArrowRight') prevBtn.click();
                if (e.key === 'ArrowLeft') nextBtn.click();
                if (e.key === ' ') cardContainer.click();
            }
        });

        // Initialize
        updateFlashcard();
    </script>
