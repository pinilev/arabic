        // --- SPEECH ENGINE (ARABIC ONLY) ---
        function speakWord(text) {
            if (!text) return;

            // Remove Hebrew diacritics/slash formatting if passed text
            const cleanText = text.replace(/[\u0591-\u05C7]/g, "").split('/')[0].trim();

            // Direct SpeechSynthesis Attempt
            try {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(cleanText);
                utterance.lang = 'ar-JO';
                utterance.rate = 0.8;

                const voices = window.speechSynthesis.getVoices();
                const regionalVoice = voices.find(v => v.lang.includes('ar-JO') || v.lang.includes('ar-IL') || v.lang.includes('ar-PS') || v.lang.startsWith('ar'));
                if (regionalVoice) {
                    utterance.voice = regionalVoice;
                }

                window.speechSynthesis.speak(utterance);
            } catch (e) {
                console.log("Speech Error:", e);
            }
        }

        // Initialize Categories Dropdown
        function initCategories() {
            const categories = [...new Set(vocabulary.map(v => v.category))];
            categorySelect.innerHTML = '<option value="all">כל הנושאים</option><option value="saved">⭐ מילים שמורות</option>';
            categories.forEach(cat => {
                const opt = document.createElement('option');
                opt.value = cat;
                opt.textContent = cat;
                categorySelect.appendChild(opt);
            });
        }

        // Filter Vocabulary based on Search & Category
        function getFilteredVocab() {
            const search = searchInput.value.trim().toLowerCase();
            const cat = categorySelect.value;

            return vocabulary.filter(item => {
                // Strip diacritics for smoother search
                const cleanHebrew = item.hebrew.replace(/[\u0591-\u05C7]/g, "").toLowerCase();
                const cleanArabic = item.arabic.replace(/[\u0591-\u05C7]/g, "").toLowerCase();
                
                const matchSearch = cleanHebrew.includes(search) || 
                                    cleanArabic.includes(search) ||
                                    (item.arabicText && item.arabicText.includes(search));
                
                let matchCat = true;
                if (cat === 'saved') {
                    matchCat = savedWords.includes(item.hebrew);
                } else if (cat !== 'all') {
                    matchCat = item.category === cat;
                }

                return matchSearch && matchCat;
            });
        }

        // Update Flashcard View
        function updateCard() {
            currentVocab = getFilteredVocab();
            
            if (currentVocab.length === 0) {
                cardHebrew.textContent = "לא נמצאו מילים";
                cardArabic.textContent = "---";
                cardArabicScript.textContent = "";
                cardCatFront.textContent = "-";
                cardCatBack.textContent = "-";
                cardCounter.textContent = "0 / 0";
                starBtn.classList.remove('text-amber-400');
                starBtn.classList.add('text-slate-300');
                return;
            }

            if (currentIndex >= currentVocab.length) {
                currentIndex = 0;
            }

            const item = currentVocab[currentIndex];

            // Reset Card Flip
            card.classList.remove('rotate-y-180');
            isCardFlipped = false;

            cardHebrew.textContent = item.hebrew;
            cardArabic.textContent = item.arabic;
            cardArabicScript.textContent = item.arabicText || '';
            cardCatFront.textContent = item.category;
            cardCatBack.textContent = item.category;
            cardCounter.textContent = `${currentIndex + 1} / ${currentVocab.length}`;

            // Check Saved Status
            if (savedWords.includes(item.hebrew)) {
                starBtn.classList.add('text-amber-400');
                starBtn.classList.remove('text-slate-300');
            } else {
                starBtn.classList.remove('text-amber-400');
                starBtn.classList.add('text-slate-300');
            }
        }

        // --- QUIZ LOGIC ---

        // --- MATCHING GAME LOGIC ---
        function startMatchGame() {
            matchWinMsg.classList.add('hidden');
            matchGrid.innerHTML = '';
            matchSelected = null;
            matchMatchedPairs = 0;

            const list = getFilteredVocab();
            if (list.length < 6) {
                matchGrid.innerHTML = '<p class="col-span-full text-center text-slate-500 py-6">נדרשות לפחות 6 מילים למשחק ההתאמה. בחר קטגוריה רחבה יותר.</p>';
                return;
            }

            const gameItems = [...list].sort(() => 0.5 - Math.random()).slice(0, 6);
            matchTotalPairs = gameItems.length;

            let cardsData = [];
            gameItems.forEach((item, index) => {
                cardsData.push({ id: index, type: 'hebrew', text: item.hebrew, original: item });
                cardsData.push({ id: index, type: 'arabic', text: item.arabic, original: item });
            });

            cardsData.sort(() => 0.5 - Math.random());

            cardsData.forEach(c => {
                const btn = document.createElement('button');
                btn.className = 'match-card bg-slate-50 hover:bg-teal-50 border-2 border-slate-200 rounded-2xl p-4 min-h-[90px] flex flex-col items-center justify-center text-center font-bold text-slate-700 transition active:scale-95 shadow-sm text-sm sm:text-base';
                btn.dataset.id = c.id;
                btn.dataset.type = c.type;
                btn.textContent = c.text;

                btn.addEventListener('click', () => handleMatchClick(btn, c));
                matchGrid.appendChild(btn);
            });
        }

        function handleMatchClick(btn, cardData) {
            if (btn.classList.contains('bg-emerald-100') || btn.disabled) return;

            if (!matchSelected) {
                matchSelected = { btn, data: cardData };
                btn.className = 'match-card bg-amber-100 border-2 border-amber-400 text-amber-900 rounded-2xl p-4 min-h-[90px] flex flex-col items-center justify-center text-center font-bold transition shadow-sm text-sm sm:text-base';
            } else if (matchSelected.btn === btn) {
                btn.className = 'match-card bg-slate-50 hover:bg-teal-50 border-2 border-slate-200 rounded-2xl p-4 min-h-[90px] flex flex-col items-center justify-center text-center font-bold text-slate-700 transition active:scale-95 shadow-sm text-sm sm:text-base';
                matchSelected = null;
            } else {
                const first = matchSelected;
                const second = { btn, data: cardData };

                if (first.data.type !== second.data.type && first.data.id === second.data.id) {
                    first.btn.className = 'match-card bg-emerald-100 border-2 border-emerald-500 text-emerald-900 rounded-2xl p-4 min-h-[90px] flex flex-col items-center justify-center text-center font-bold transition shadow-sm text-sm sm:text-base cursor-default';
                    second.btn.className = 'match-card bg-emerald-100 border-2 border-emerald-500 text-emerald-900 rounded-2xl p-4 min-h-[90px] flex flex-col items-center justify-center text-center font-bold transition shadow-sm text-sm sm:text-base cursor-default';
                    
                    first.btn.disabled = true;
                    second.btn.disabled = true;

                    matchMatchedPairs++;
                    matchSelected = null;

                    if (matchMatchedPairs === matchTotalPairs) {
                        setTimeout(() => {
                            matchWinMsg.classList.remove('hidden');
                        }, 300);
                    }
                } else {
                    second.btn.className = 'match-card bg-rose-100 border-2 border-rose-400 text-rose-900 rounded-2xl p-4 min-h-[90px] flex flex-col items-center justify-center text-center font-bold transition shadow-sm text-sm sm:text-base';
                    
                    setTimeout(() => {
                        first.btn.className = 'match-card bg-slate-50 hover:bg-teal-50 border-2 border-slate-200 rounded-2xl p-4 min-h-[90px] flex flex-col items-center justify-center text-center font-bold text-slate-700 transition active:scale-95 shadow-sm text-sm sm:text-base';
                        second.btn.className = 'match-card bg-slate-50 hover:bg-teal-50 border-2 border-slate-200 rounded-2xl p-4 min-h-[90px] flex flex-col items-center justify-center text-center font-bold text-slate-700 transition active:scale-95 shadow-sm text-sm sm:text-base';
                        matchSelected = null;
                    }, 600);
                }
            }
        }

        restartMatchBtn.addEventListener('click', startMatchGame);

        // --- LIST VIEW LOGIC ---
        function renderTable() {
            const list = getFilteredVocab();
            vocabTableBody.innerHTML = '';

            if (list.length === 0) {
                vocabTableBody.innerHTML = '<tr><td colspan="3" class="p-6 text-center text-slate-400">לא נמצאו מילים בהתאם לסינון</td></tr>';
                return;
            }

            list.forEach((item, index) => {
                const tr = document.createElement('tr');
                tr.className = index % 2 === 0 ? 'bg-white hover:bg-slate-50' : 'bg-slate-50/50 hover:bg-slate-100/60';
                tr.innerHTML = `
                    <td class="p-3.5 font-bold text-slate-800">${item.hebrew}</td>
                    <td class="p-3.5 font-semibold text-teal-700">${item.arabic}</td>
                    <td class="p-3.5 text-xs text-slate-500">
                        <span class="bg-slate-100 border border-slate-200 px-2.5 py-1 rounded-lg">${item.category}</span>
                    </td>
                `;
                vocabTableBody.appendChild(tr);
            });
        }

        // --- NAVIGATION MODES SWITCHING ---
        function setMode(mode) {
            [modeFlashcardsBtn, modeQuizBtn, modeMatchBtn, modeListBtn].forEach(btn => {
                btn.className = 'hover:bg-teal-700/60 text-white font-medium px-3 py-1.5 rounded-lg text-xs sm:text-sm transition flex items-center gap-1.5';
            });

            [sectionFlashcards, sectionQuiz, sectionMatch, sectionList].forEach(sec => {
                sec.classList.add('hidden');
            });

            if (mode === 'flashcards') {
                modeFlashcardsBtn.className = 'bg-white text-teal-900 font-bold px-3 py-1.5 rounded-lg text-xs sm:text-sm transition shadow flex items-center gap-1.5';
                sectionFlashcards.classList.remove('hidden');
                updateCard();
            } else if (mode === 'quiz') {
                modeQuizBtn.className = 'bg-white text-teal-900 font-bold px-3 py-1.5 rounded-lg text-xs sm:text-sm transition shadow flex items-center gap-1.5';
                sectionQuiz.classList.remove('hidden');
                startQuiz();
            } else if (mode === 'match') {
                modeMatchBtn.className = 'bg-white text-teal-900 font-bold px-3 py-1.5 rounded-lg text-xs sm:text-sm transition shadow flex items-center gap-1.5';
                sectionMatch.classList.remove('hidden');
                startMatchGame();
            } else if (mode === 'list') {
                modeListBtn.className = 'bg-white text-teal-900 font-bold px-3 py-1.5 rounded-lg text-xs sm:text-sm transition shadow flex items-center gap-1.5';
                sectionList.classList.remove('hidden');
                renderTable();
            }
        }

        modeFlashcardsBtn.addEventListener('click', () => setMode('flashcards'));
        modeQuizBtn.addEventListener('click', () => setMode('quiz'));
        modeMatchBtn.addEventListener('click', () => setMode('match'));
        modeListBtn.addEventListener('click', () => setMode('list'));

        // App Initialization
        window.onload = function() {
            initCategories();
            pickRandomCard();
            updateCard();
        };
    </script>
</body>
</html>
